<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student Login - Hostel Management System</title>
  <meta name="description" content="Resident student login portal for hostel management system.">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- Navigation Bar -->
  <header class="header" id="mainHeader">
    <div class="container navbar">
      <a href="index.html" class="logo" id="siteLogo">
        <div class="logo-badge">H</div>
        <div class="logo-text">Hostel<span>Hub</span></div>
      </a>

      <button class="hamburger" id="hamburgerBtn" aria-label="Toggle navigation menu">
        <span></span>
        <span></span>
        <span></span>
      </button>

      <nav class="nav-menu" id="navMenu">
        <a href="index.html" class="nav-link" id="navHome">Home</a>
        <a href="dashboard.html" class="nav-link" id="navDashboard">Dashboard</a>
        <a href="forms.html" class="nav-link" id="navForms">Forms</a>
        <a href="table.html" class="nav-link" id="navTable">Complaints</a>
        <div class="nav-auth-buttons">
          <a href="login.html" class="btn btn-primary btn-sm" id="navLoginBtn">Login</a>
          <a href="register.html" class="btn btn-outline btn-sm" id="navRegisterBtn">Register</a>
        </div>
      </nav>
    </div>
  </header>

  <!-- Login Form Main Container -->
  <main class="main-content">
    <div class="container">
      <div class="auth-wrapper" id="loginCard">
        <div class="auth-header">
          <div class="section-tag">Student Access</div>
          <h2>Resident Login</h2>
          <p>Enter your registered email and password to access your hostel account.</p>
        </div>

        <form id="loginForm" novalidate>
          <!-- Email Input -->
          <div class="form-group">
            <label for="loginEmail" class="form-label">
              Email Address <span class="required">*</span>
            </label>
            <input 
              type="email" 
              id="loginEmail" 
              class="form-control" 
              placeholder="e.g. student@college.edu" 
              autocomplete="email"
              required
            >
            <span class="error-message" id="emailError"></span>
          </div>

          <!-- Password Input with Show/Hide Toggle -->
          <div class="form-group">
            <label for="loginPassword" class="form-label">
              Password <span class="required">*</span>
            </label>
            <div class="input-password-wrapper">
              <input 
                type="password" 
                id="loginPassword" 
                class="form-control" 
                placeholder="Enter your password" 
                autocomplete="current-password"
                required
              >
              <button 
                type="button" 
                class="toggle-password-btn" 
                data-target="loginPassword" 
                id="toggleLoginPasswordBtn"
                aria-label="Toggle password visibility"
              >
                Show
              </button>
            </div>
            <span class="error-message" id="passwordError"></span>
          </div>

          <!-- Submit Button -->
          <button type="submit" class="btn btn-primary btn-block" id="loginSubmitBtn">
            Sign In to Dashboard
          </button>

          <!-- Form Footer Links -->
          <div class="form-footer">
            <p>Don't have an account? <a href="register.html"><strong>Register here</strong></a></p>
          </div>
        </form>
      </div>
    </div>
  </main>

  <!-- Footer -->
  <footer class="footer" id="mainFooter">
    <div class="container">
      <div class="footer-bottom" style="border-top: none; padding-top: 0;">
        <p>&copy; 2026 Hostel Management System. All Rights Reserved.</p>
      </div>
    </div>
  </footer>

  <script src="js/script.js"></script>
</body>
</html>
